name: visionseeway
description: "VisionWay - App de accesibilidad para personas con discapacidad visual"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.0.2
  camera: ^0.11.0+2
  google_maps_flutter: ^2.9.0
  google_maps_flutter_web: ^0.5.10
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  google_mlkit_object_detection: ^0.13.1
  google_mlkit_text_recognition: ^0.13.1
  speech_to_text: ^7.3.0
  http: ^1.2.2
  image: ^4.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
